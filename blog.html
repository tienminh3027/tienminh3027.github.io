<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thành Tích</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        html, body { 
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
        }
        
        body { 
            font-family: 'Quicksand', sans-serif; 
            background: #02010a; 
            color: white; 
            min-height: 100vh; 
        }
        
        .galaxy-bg { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            background: radial-gradient(circle at center, #1b0b2e 0%, #02010a 100%); 
            z-index: -1; 
        }
        
        .container { 
            max-width: 800px; 
            width: calc(100% - 40px);
            margin: 50px auto; 
            padding: 0 20px;
            position: relative; 
            z-index: 1; 
        }
        
        header h1 { 
            text-align: center; 
            font-family: 'Pacifico', cursive; 
            font-size: clamp(2rem, 8vw, 3rem);
            margin-bottom: 40px;
            background: linear-gradient(to right, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            background-clip: text;
            background-size: 400%; 
            animation: rgbMove 8s linear infinite, popIn 0.8s cubic-bezier(.34,1.56,.64,1) both, floatName 3.5s ease-in-out 0.8s infinite;
        }
        
        @keyframes rgbMove { 
            from { background-position: 0%; } 
            to { background-position: 400%; } 
        }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.6) translateY(-20px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes floatName { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

        /* Hạt bụi vũ trụ trôi nổi nền */
        .particle {
            position: fixed;
            border-radius: 50%;
            background: rgba(255,255,255,0.6);
            pointer-events: none;
            z-index: 0;
            animation: floatParticle linear infinite;
        }
        @keyframes floatParticle {
            0% { transform: translateY(0); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translateY(-100vh); opacity: 0; }
        }

        /* Vòng xoay tải dữ liệu */
        .loader {
            width: 46px; height: 46px;
            margin: 60px auto;
            border: 4px solid rgba(255,255,255,0.15);
            border-top-color: #00ff87;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .card {
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            padding: 20px;
            border-radius: 20px; 
            margin-bottom: 20px;
            opacity: 0;
            animation: slideUp 0.6s cubic-bezier(.25,.8,.25,1) forwards; 
            transition: transform 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
            overflow: hidden;
        }
        
        .card:hover { 
            transform: translateY(-6px) scale(1.01); 
            border-color: #00ff87; 
            box-shadow: 0 10px 30px rgba(0, 255, 135, 0.15);
        }
        
        .card h3 { 
            color: #60efff; 
            margin-bottom: 15px; 
            font-family: 'Montserrat', sans-serif; 
            font-size: clamp(1.2rem, 5vw, 1.5rem);
            word-break: break-word;
        }
        
        .card-content { 
            line-height: 1.6; 
            opacity: 0.9; 
            white-space: pre-wrap; 
            margin-bottom: 15px; 
            font-size: clamp(0.9rem, 3.5vw, 1rem);
            word-break: break-word;
        }

        /* FIX ẢNH - XÓA MỌI KÍCH THƯỚC CỨ */
        .card-content img {
            max-width: 100% !important;
            width: auto !important;
            height: auto !important;
            display: block !important;
            margin: 15px 0 !important;
            border-radius: 10px;
        }
        
        .date-tag { 
            background: #00ff87; 
            color: #000; 
            padding: 4px 12px; 
            border-radius: 50px; 
            font-weight: bold; 
            font-size: clamp(0.7rem, 3vw, 0.8rem);
            display: inline-block;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .card:hover .date-tag {
            transform: scale(1.08);
            box-shadow: 0 0 12px rgba(0,255,135,0.6);
        }
        
        .back-btn { 
            display: block; 
            width: fit-content; 
            max-width: 90%;
            margin: 40px auto; 
            padding: 12px 30px; 
            border: 2px solid white; 
            color: white; 
            text-decoration: none; 
            border-radius: 50px; 
            transition: 0.3s; 
            text-align: center;
            font-size: clamp(0.9rem, 3.5vw, 1rem);
            position: relative;
            overflow: hidden;
        }
        .back-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -75%;
            width: 50%; height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.5), transparent);
            transform: skewX(-25deg);
            animation: shine 3.5s ease-in-out infinite;
        }
        @keyframes shine { 0% { left: -75%; } 60% { left: 130%; } 100% { left: 130%; } }
        
        .back-btn:hover { 
            background: white; 
            color: black; 
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255,255,255,0.25);
        }
        .back-btn:active { transform: scale(0.96); }
        
        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(30px) scale(0.98); } 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }

        @media (max-width: 600px) {
            .container {
                margin: 30px auto;
                width: calc(100% - 30px);
            }
            
            .card {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="galaxy-bg"></div>
    <div id="particleField"></div>
    <div class="container">
        <header><h1>Blog Space</h1></header>
        <div id="list"><div class="loader"></div></div>
        <a href="index.html" class="back-btn">← TRANG CHỦ</a>
    </div>
    <script>
        // Hạt bụi vũ trụ trôi nổi trong nền
        const particleField = document.getElementById('particleField');
        function spawnParticle() {
            const pt = document.createElement('div');
            pt.className = 'particle';
            const size = Math.random() * 3 + 1;
            pt.style.width = size + 'px';
            pt.style.height = size + 'px';
            pt.style.left = (Math.random() * 100) + '%';
            pt.style.bottom = '-10px';
            pt.style.animationDuration = (Math.random() * 6 + 6) + 's';
            particleField.appendChild(pt);
            setTimeout(() => pt.remove(), 12000);
        }
        setInterval(spawnParticle, 500);

        async function load() {
            try {
                const res = await fetch('https://api.github.com/repos/tienminh3027/profile/issues?state=open');
                const data = await res.json();
                const div = document.getElementById('list');
                div.innerHTML = '';
                
                data.forEach((i, index) => {
                    let body = i.body || '';
                    let date = new Date(i.created_at).toLocaleDateString('vi-VN');
                    
                    // Lấy ngày từ body nếu có
                    const match = body.match(/Ngày:\s*(\d{1,2}\/\d{1,2}\/\d{4})/i);
                    if (match) { 
                        date = match[1]; 
                        body = body.replace(match[0], '').trim(); 
                    }
                    
                    const item = document.createElement('div');
                    item.className = 'card';
                    item.style.animationDelay = (index * 0.12) + 's';
                    
                    // Tạo nội dung
                    const content = document.createElement('div');
                    content.className = 'card-content';
                    content.innerHTML = body;
                    
                    item.innerHTML = `<h3>${i.title}</h3>`;
                    item.appendChild(content);
                    item.innerHTML += `<span class="date-tag">📅 ${date}</span>`;
                    
                    div.appendChild(item);
                    
                    // XÓA MỌI WIDTH/HEIGHT CỨ SAU KHI RENDER
                    setTimeout(() => {
                        const imgs = item.querySelectorAll('img');
                        imgs.forEach(img => {
                            img.removeAttribute('width');
                            img.removeAttribute('height');
                            img.removeAttribute('style');
                        });
                    }, 100);
                });
                
            } catch (error) {
                console.error('Lỗi:', error);
                document.getElementById('list').innerHTML = '<div class="card"><p>Không thể tải dữ liệu</p></div>';
            }
        }
        
        load();
    </script>
</body>
</html>
