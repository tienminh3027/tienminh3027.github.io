<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nguyễn Tiến Minh</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background: #02010a; 
            color: white; 
            position: fixed;
            touch-action: none; /* Chặn mọi hành vi cuộn/kéo trên mobile */
        }

        .galaxy-wrapper { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            background: radial-gradient(circle at 50% 50%, #1b0b2e 0%, #02010a 100%);
            z-index: 1; 
            overflow: hidden;
        }

        .content { 
            position: fixed; /* Đổi thành fixed để chắc chắn không bị đẩy */
            top: 0;
            left: 0;
            z-index: 10; 
            width: 100vw;
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 20px;
            text-align: center;
        }

        .profile-name { 
            font-family: 'Pacifico', cursive; 
            font-size: clamp(2.2rem, 12vw, 5rem);  
            background: linear-gradient(to right, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 400%; 
            animation: rgbMove 5s linear infinite, floatName 3.5s ease-in-out infinite, popIn 0.9s cubic-bezier(.34,1.56,.64,1) both;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.3));
            margin-bottom: 20px;
            width: 100%;
            max-width: 90vw; /* Giới hạn chiều rộng */
        }
        @keyframes rgbMove { from { background-position: 0%; } to { background-position: 400%; } }
        @keyframes floatName { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.5) translateY(30px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }

        .btn-entry {
            background: rgba(255, 255, 255, 0.1); 
            border: 2px solid white; 
            color: white;
            padding: 12px 30px; 
            border-radius: 50px; 
            text-decoration: none; 
            font-weight: 900;
            transition: 0.4s; 
            backdrop-filter: blur(10px); 
            margin-bottom: 30px;
            font-size: clamp(12px, 3.5vw, 14px);
            letter-spacing: 1px;
            text-transform: uppercase;
            display: inline-block;
            position: relative;
            overflow: hidden;
            animation: fadeSlideUp 0.9s ease-out 0.3s both, pulseGlow 2.5s ease-in-out 1.2s infinite;
        }
        .btn-entry::before {
            content: '';
            position: absolute;
            top: 0; left: -75%;
            width: 50%; height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.5), transparent);
            transform: skewX(-25deg);
            animation: shine 3s ease-in-out infinite;
        }
        @keyframes shine { 0% { left: -75%; } 60% { left: 130%; } 100% { left: 130%; } }
        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 0px rgba(255,255,255,0.3); } 50% { box-shadow: 0 0 18px rgba(255,255,255,0.6); } }
        .btn-entry:hover { background: white; color: black; transform: scale(1.08); }
        .btn-entry:active { transform: scale(0.95); }

        .social-icons { 
            display: flex; 
            gap: 20px; 
            flex-wrap: wrap;
            justify-content: center;
        }
        .social-icon { 
            width: 50px; 
            height: 50px; 
            min-width: 50px; /* Đảm bảo không co lại */
            min-height: 50px;
            border-radius: 50%; 
            background: rgba(255,255,255,0.1); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border: 1px solid rgba(255,255,255,0.3); 
            transition: 0.3s;
            flex-shrink: 0; /* Không cho icon bị nén */
            animation: fadeSlideUp 0.9s ease-out both, bobIcon 3s ease-in-out infinite;
            animation-delay: 0.6s, 1.6s;
        }
        .social-icon:nth-child(2) { animation-delay: 0.75s, 1.9s; }
        @keyframes bobIcon { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-6px) rotate(6deg); } }
        .social-icon:hover { background: rgba(255,255,255,0.25); transform: scale(1.15) translateY(-4px); box-shadow: 0 0 20px rgba(255,255,255,0.4); }
        .social-icon img { 
            width: 24px; 
            height: 24px;
            max-width: 24px; /* Chặn cứng kích thước ảnh */
            max-height: 24px;
            object-fit: contain;
            filter: invert(1); 
        }
        .social-icon:active { transform: scale(0.9); background: rgba(255,255,255,0.3); }

        /* Hành tinh phát sáng trôi nổi phía sau */
        .planet {
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
            opacity: 0.5;
            pointer-events: none;
            animation: driftPlanet linear infinite;
        }
        @keyframes driftPlanet {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(20px, -25px) scale(1.05); }
            100% { transform: translate(0, 0) scale(1); }
        }

        /* Hạt bụi vũ trụ trôi nổi */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.6);
            pointer-events: none;
            animation: floatParticle linear infinite;
        }
        @keyframes floatParticle {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-100vh) translateX(20px); opacity: 0; }
        }

        /* Sao băng: Giới hạn quỹ đạo trong viewport */
        .meteor {
            position: absolute; 
            width: 2px; 
            height: 60px; 
            background: linear-gradient(to bottom, rgba(255,255,255,1), transparent);
            opacity: 0; 
            pointer-events: none;
            will-change: transform; /* Tối ưu performance */
        }
        /* Animation chỉ di chuyển TRONG màn hình */
        @keyframes meteorRain {
            0% { transform: translate(0, 0) rotate(45deg); opacity: 0; }
            5% { opacity: 1; }
            40% { opacity: 1; }
            50% { transform: translate(-40vw, 40vh) rotate(45deg); opacity: 0; }
            100% { transform: translate(-40vw, 40vh) rotate(45deg); opacity: 0; }
        }
        .meteor { animation: meteorRain 4s linear infinite; }

        .star { 
            position: absolute; 
            background: white; 
            border-radius: 50%; 
            animation: twinkle var(--t) infinite; 
            pointer-events: none;
            will-change: opacity;
        }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="galaxy-wrapper">
        <div id="starField"></div>
        <div id="meteorField"></div>
        <div id="planetField"></div>
        <div id="particleField"></div>
    </div>
    
    <div class="content">
        <h1 class="profile-name">Tiến Minh</h1>
        <a href="blog.html" class="btn-entry">XEM THÀNH TÍCH 🏆</a>
        <div class="social-icons">
            <a href="https://facebook.com/tienminh3027" target="_blank" class="social-icon">
                <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="FB">
            </a>
            <a href="https://tiktok.com/@tienminh3027" target="_blank" class="social-icon">
                <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" alt="TT">
            </a>
        </div>
    </div>

    <script>
        const stars = document.getElementById('starField');
        const meteors = document.getElementById('meteorField');
        const planets = document.getElementById('planetField');
        const particles = document.getElementById('particleField');
        
        // Tạo sao nền
        for (let i = 0; i < 100; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            const size = Math.random() * 2 + 1 + 'px';
            s.style.width = size; 
            s.style.height = size;
            // Giữ sao TRONG viewport
            s.style.left = (Math.random() * 95) + '%';
            s.style.top = (Math.random() * 95) + '%';
            s.style.setProperty('--t', Math.random() * 3 + 2 + 's');
            stars.appendChild(s);
        }

        // Tạo sao băng
        setInterval(() => {
            const m = document.createElement('div');
            m.className = 'meteor';
            // Chỉ spawn sao băng TRONG viewport
            m.style.left = (Math.random() * 90) + '%'; 
            m.style.top = (Math.random() * 40) + '%';
            m.style.animationDuration = (Math.random() * 2 + 3) + 's';
            meteors.appendChild(m);
            setTimeout(() => m.remove(), 4000);
        }, 1500);

        // Tạo hành tinh phát sáng nhẹ phía sau
        const planetColors = ['#ff6ec4', '#7873f5', '#00ffd0', '#ffd76e'];
        for (let i = 0; i < 3; i++) {
            const p = document.createElement('div');
            p.className = 'planet';
            const size = Math.random() * 60 + 40;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.left = (Math.random() * 80 + 5) + '%';
            p.style.top = (Math.random() * 70 + 5) + '%';
            p.style.background = `radial-gradient(circle at 35% 35%, ${planetColors[i % planetColors.length]}, transparent 70%)`;
            p.style.animationDuration = (Math.random() * 6 + 8) + 's';
            planets.appendChild(p);
        }

        // Tạo hạt bụi vũ trụ bay lên liên tục
        function spawnParticle() {
            const pt = document.createElement('div');
            pt.className = 'particle';
            const size = Math.random() * 3 + 1;
            pt.style.width = size + 'px';
            pt.style.height = size + 'px';
            pt.style.left = (Math.random() * 100) + '%';
            pt.style.bottom = '-10px';
            pt.style.animationDuration = (Math.random() * 6 + 6) + 's';
            particles.appendChild(pt);
            setTimeout(() => pt.remove(), 12000);
        }
        setInterval(spawnParticle, 400);

        // Hiệu ứng thị sai (parallax) theo chuyển động chuột / con quay hồi chuyển
        function applyParallax(x, y) {
            stars.style.transform = `translate(${x * 10}px, ${y * 10}px)`;
            planets.style.transform = `translate(${x * 25}px, ${y * 25}px)`;
        }
        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) - 0.5;
            const y = (e.clientY / window.innerHeight) - 0.5;
            applyParallax(x, y);
        });
        window.addEventListener('deviceorientation', (e) => {
            const x = Math.max(-0.5, Math.min(0.5, (e.gamma || 0) / 45));
            const y = Math.max(-0.5, Math.min(0.5, (e.beta || 0) / 90));
            applyParallax(x, y);
        });
        
        // Chặn cuộn trên mobile (backup thêm bằng JS)
        document.body.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
    </script>
</body>
</html>
